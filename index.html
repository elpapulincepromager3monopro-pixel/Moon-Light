<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Light</title>
<style>body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#0b1020,#111827);color:#e5e7eb}.wrap{max-width:900px;margin:32px auto;padding:16px}.card{background:#111827;border:1px solid #334155;border-radius:16px;overflow:hidden}header{padding:20px 24px;border-bottom:1px solid #334155}h1{margin:0}.body{display:flex;flex-direction:column;min-height:520px}#chat{flex:1;padding:20px 24px}.msg{padding:12px 14px;margin-bottom:8px;border-radius:14px;white-space:pre-wrap;background:#1e293b}form{display:flex;gap:10px;padding:18px 24px;border-top:1px solid #334155}input{flex:1;padding:12px 14px;background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:10px}button{padding:12px 18px;background:#7dd3fc;border:0;border-radius:10px;font-weight:700}@media(max-width:640px){form{flex-direction:column}}</style>
</head>
<body><main class="wrap"><section class="card"><header><h1>Moon Light</h1></header><div class="body"><div id="chat"><div class="msg">Hola. Puedes usar Moon Light directamente, sin clave API.</div></div><form id="form"><input id="question" placeholder="Escribe tu pregunta..." autocomplete="off"><button>Enviar</button></form></div></section></main><script>const form=document.getElementById("form"),input=document.getElementById("question"),chat=document.getElementById("chat");form.addEventListener("submit",function(event){event.preventDefault();const q=input.value.trim();if(!q)return;const user=document.createElement("div");user.className="msg";user.textContent="Tú: "+q;const answer=document.createElement("div");answer.className="msg";answer.textContent="Moon Light: Puedo ayudarte sin clave API. Prueba un cálculo como (8 + 4) / 2 o una conversión como 5 km a m.";chat.append(user,answer);input.value=""});</script></body>
</html>
