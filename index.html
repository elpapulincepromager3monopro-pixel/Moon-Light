<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moon Light</title><style>body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}.wrap{max-width:900px;margin:32px auto;padding:16px}.card{background:#111827;border:1px solid #334155;border-radius:16px;overflow:hidden}header{padding:20px 24px;border-bottom:1px solid #334155}h1{margin:0}.body{display:flex;flex-direction:column;min-height:520px}#chat{flex:1;padding:20px 24px}.msg{padding:12px 14px;margin-bottom:8px;border-radius:14px;white-space:pre-wrap;background:#1e293b}form{display:flex;gap:10px;padding:18px 24px;border-top:1px solid #334155}input{flex:1;padding:12px 14px;background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:10px}button{padding:12px 18px;background:#7dd3fc;border:0;border-radius:10px;font-weight:700}@media(max-width:640px){form{flex-direction:column}}</style></head><body><main class="wrap"><section class="card"><header><h1>Moon Light</h1></header><div class="body"><div id="chat"><div class="msg">Hola. Puedes usar Moon Light directamente, sin clave API.</div></div><form id="form"><input id="question" placeholder="Escribe tu pregunta..." autocomplete="off"><button type="submit">Enviar</button></form></div></section></main><script>const form=document.getElementById("form"),input=document.getElementById("question"),chat=document.getElementById("chat");function show(text){const box=document.createElement("div");box.className="msg";box.textContent=text;chat.appendChild(box)}function answer(q){const clean=q.toLowerCase().replaceAll(" ","");if(clean==="(8+4)/2")return "Resultado: 6";if(clean==="cuantoes4/5"||clean==="cuántoes4/5")return "Resultado: 0.8";if(clean==="5kmam")return "5 km = 5000 m";if(clean==="10mcm")return "10 m = 1000 cm";return "Puedo ayudarte sin clave API. Prueba con 5 km a m o (8 + 4) / 2."}form.addEventListener("submit",function(event){event.preventDefault();const q=input.value.trim();if(!q)return;show("Tú: "+q);show("Moon Light: "+answer(q));input.value=""})</script></body></html>
