<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Moon Light</title><style>body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#0b1020;color:#e5e7eb}.wrap{max-width:900px;margin:32px auto;padding:16px}.card{background:#111827;border:1px solid #334155;border-radius:16px;overflow:hidden}header{padding:20px 24px;border-bottom:1px solid #334155}h1{margin:0}.body{display:flex;flex-direction:column;min-height:520px}#chat{flex:1;padding:20px 24px}.msg{padding:12px 14px;margin-bottom:8px;border-radius:14px;white-space:pre-wrap;background:#1e293b}form{display:flex;gap:10px;padding:18px 24px;border-top:1px solid #334155}input{flex:1;padding:12px 14px;background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:10px}button{padding:12px 18px;background:#7dd3fc;border:0;border-radius:10px;font-weight:700}@media(max-width:640px){form{flex-direction:column}}</style></head><body><main class="wrap"><section class="card"><header><h1>Moon Light</h1></header><div class="body"><div id="chat"><div class="msg">Hola. Puedes usar Moon Light directamente, sin clave API.</div></div><form id="form"><input id="question" placeholder="Escribe tu pregunta..." autocomplete="off"><button type="submit">Enviar</button></form></div></section></main><script>const form=document.getElementById("form"),input=document.getElementById("question"),chat=document.getElementById("chat");function show(text){const box=document.createElement("div");box.className="msg";box.textContent=text;chat.appendChild(box)}function answer(q){const units={mm:["longitud",.001],cm:["longitud",.01],m:["longitud",1],km:["longitud",1000],g:["masa",1],kg:["masa",1000],ml:["volumen",.001],l:["volumen",1]};const parts=q.toLowerCase().match(/(-?[0-9]+(?:[.,][0-9]+)?)\s*([a-z]+)\s+(?:a|en|to)\s+([a-z]+)/);if(parts&&units[parts[2]]&&units[parts[3]]&&units[parts[2]][0]===units[parts[3]][0]){const value=Number(parts[1].replace(",","."))*units[parts[2]][1]/units[parts[3]][1];return parts[1]+" "+parts[2]+" = "+Number(value.toFixed(10))+" "+parts[3]}const expression=q.split("").filter(function(c){return "0123456789()+-*/., ".includes(c)}).join("").replace(",",".").trim();if(expression&&/[+*/-]/.test(expression)){try{const value=Function("return ("+expression+")")();if(Number.isFinite(value))return "Resultado: "+value}catch(error){}}return "Puedo ayudarte sin clave API. Prueba con 5 km a m o (8 + 4) / 2."}form.addEventListener("submit",function(event){event.preventDefault();const q=input.value.trim();if(!q)return;show("Tú: "+q);show("Moon Light: "+answer(q));input.value=""});</script></body></html>
